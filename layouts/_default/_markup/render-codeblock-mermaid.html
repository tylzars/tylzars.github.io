<pre class="mermaid">{{ .Inner | htmlEscape | safeHTML }}</pre>
{{ if not (.Page.Store.Get "hasMermaid") }}
{{ .Page.Store.Set "hasMermaid" true }}
<style>
  pre.mermaid { background: none; border: none; text-align: center; }
  pre.mermaid svg { max-width: 100% !important; max-height: none !important; max-inline-size: 100% !important; max-block-size: none !important; }
</style>
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
  mermaid.initialize({ startOnLoad: true });
</script>
{{ end }}
